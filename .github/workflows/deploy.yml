name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            open ftp://${FTP_USER}:${FTP_PASS}@${FTP_SERVER};
            ls;
            pwd;
            mirror -R --verbose --delete --no-perms --exclude .git/ --exclude .git --exclude .github/ --exclude node_modules/ --exclude database.sql --exclude README.md --exclude 'original website/' . /khuruphan-rus.free.je/htdocs/;
            ls /khuruphan-rus.free.je/htdocs/;
            quit
          "
