name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BACKUP_RETENTION_DAYS: '7'

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create pre-deploy backup artifact
        run: |
          mkdir -p backups
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          SHA="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          REF="${{ github.ref }}"
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Deploy PROD start: sha=${SHA} actor=${ACTOR} ref=${REF}" >> backups/deploy.log
          echo "Backup retention days: ${{ env.BACKUP_RETENTION_DAYS }}" >> backups/deploy.log
          tar -czf "pre-deploy-${SHA}.tar.gz" \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=backups \
            --exclude=uploads \
            --exclude="original website" \
            --exclude=database.sql \
            . || true
          ls -lh pre-deploy-*.tar.gz || true

      - name: Attempt to download latest server backups (PROD)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USER: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          mkdir -p server-backup/backups || true
          lftp -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            open ftp://${FTP_USER}:${FTP_PASS}@${FTP_SERVER};
            mirror --verbose --no-perms --only-newer /htdocs/backups ./server-backup/backups || echo 'No remote backups dir';
            quit
          " || echo "Server backup download skipped"
          ls -lh server-backup/ 2>&1 || true

      - name: Upload pre-deploy backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-prod-${{ github.sha }}
          path: |
            pre-deploy-${{ github.sha }}.tar.gz
            backups/deploy.log
            server-backup/
          if-no-files-found: warn
          retention-days: 7

      - name: Deploy via FTPS to PROD (lftp)
        env:
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USER: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.PROD_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.PROD_FTP_SERVER_DIR }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          # fallback ถ้าไม่ได้ตั้ง SERVER_DIR ให้ใช้ /htdocs/
          DIR="${FTP_SERVER_DIR:-/htdocs/}"
          echo "Deploying to PROD dir: $DIR"
          lftp -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            open ftp://${FTP_USER}:${FTP_PASS}@${FTP_SERVER};
            mirror -R --verbose --delete --no-perms --exclude .git/ --exclude .github/ --exclude node_modules/ --exclude database.sql --exclude README.md --exclude 'original website/' --exclude backups/ --exclude uploads/ . $DIR;
            quit
          "
