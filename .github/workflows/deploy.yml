name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BACKUP_RETENTION_DAYS: "7"

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      actions: write

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install lftp
      # --------------------------------------------------
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # --------------------------------------------------
      # 3. Prepare FTPS credentials
      # --------------------------------------------------
      - name: Prepare FTPS credentials
        env:
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USER: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          clean_host() {
            printf '%s' "$1" \
              | tr -d '\r\n' \
              | xargs \
              | sed \
                  -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' \
                  -e 's#.*@##' \
                  -e 's#/.*$##' \
                  -e 's#:.*$##' \
              | tr '[:upper:]' '[:lower:]' \
              | xargs
          }

          FTP_SERVER="$(clean_host "$FTP_SERVER")"
          FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '\r\n')"
          FTP_PASS="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"

          if [ -z "$FTP_SERVER" ]; then
            echo "ERROR: PROD_FTP_SERVER is empty"
            exit 1
          fi

          if [ -z "$FTP_USER" ]; then
            echo "ERROR: PROD_FTP_USERNAME is empty"
            exit 1
          fi

          if [ -z "$FTP_PASS" ]; then
            echo "ERROR: PROD_FTP_PASSWORD is empty"
            exit 1
          fi

          if ! printf '%s' "$FTP_SERVER" \
            | grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'; then
            echo "ERROR: Invalid FTP hostname"
            exit 1
          fi

          printf 'machine %s login %s password %s\n' \
            "$FTP_SERVER" \
            "$FTP_USER" \
            "$FTP_PASS" > ~/.netrc

          chmod 600 ~/.netrc

          echo "FTP_HOST_CLEAN=$FTP_SERVER" >> "$GITHUB_ENV"

          echo "Checking DNS..."
          if getent hosts "$FTP_SERVER" >/dev/null 2>&1; then
            echo "DNS: OK"
          else
            echo "WARNING: DNS lookup failed"
          fi

      # --------------------------------------------------
      # 4. Create local pre-deploy backup
      # --------------------------------------------------
      - name: Create pre-deploy backup
        run: |
          set -euo pipefail

          mkdir -p backups

          SHA="${{ github.sha }}"
          TIMESTAMP="$(date -u +%Y%m%d_%H%M%S)"

          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Production deploy started" \
            > backups/deploy.log

          echo "SHA: ${SHA}" >> backups/deploy.log
          echo "Actor: ${{ github.actor }}" >> backups/deploy.log
          echo "Ref: ${{ github.ref }}" >> backups/deploy.log
          echo "Timestamp: ${TIMESTAMP}" >> backups/deploy.log

          # เขียน tarball ลง backups/ (ที่ถูก exclude) กัน "file changed as we read it"
          tar -czf "backups/pre-deploy-${SHA}.tar.gz" \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=backups \
            --exclude=uploads \
            --exclude="original website" \
            --exclude=database.sql \
            --exclude='pre-deploy-*.tar.gz' \
            .

          test -s "backups/pre-deploy-${SHA}.tar.gz"

          echo "Backup created:"
          ls -lh "backups/pre-deploy-${SHA}.tar.gz"

      # --------------------------------------------------
      # 5. Try to download existing server backups
      # --------------------------------------------------
      - name: Download latest server backups
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -u

          mkdir -p server-backup

          timeout 120 lftp -e "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ftp:ssl-protect-list yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 1;
            set dns:order inet;
            open $FTP_HOST_CLEAN;
            mirror \
              --verbose \
              --no-perms \
              --only-newer \
              /htdocs/backups \
              ./server-backup;
            quit
          " || echo "WARNING: Could not download remote backups. Continuing deploy."

          echo "Remote backup result:"
          find server-backup -maxdepth 3 -type f -print 2>/dev/null || true

      # --------------------------------------------------
      # 6. Upload backup to GitHub Actions artifact
      # --------------------------------------------------
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-prod-${{ github.sha }}
          path: |
            backups/pre-deploy-${{ github.sha }}.tar.gz
            backups/deploy.log
            server-backup/
          if-no-files-found: warn
          retention-days: ${{ env.BACKUP_RETENTION_DAYS }}

      # --------------------------------------------------
      # 7. Validate production directory
      # --------------------------------------------------
      - name: Validate production directory
        env:
          FTP_SERVER_DIR: ${{ secrets.PROD_FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          DIR="$(printf '%s' "$FTP_SERVER_DIR" | tr -d '\r\n' | xargs)"

          # Default + normalize: รับ htdocs | /htdocs | /htdocs/ → /htdocs/
          if [ -z "$DIR" ]; then
            DIR="/htdocs/"
          fi
          case "$DIR" in
            /*) ;;
            *) DIR="/$DIR" ;;
          esac
          case "$DIR" in
            */) ;;
            *) DIR="$DIR/" ;;
          esac

          echo "Production directory: $DIR"
          echo "FTP_DIR_CLEAN=$DIR" >> "$GITHUB_ENV"

          timeout 60 lftp -e "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ftp:ssl-protect-list yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 1;
            set dns:order inet;
            open $FTP_HOST_CLEAN;
            pwd;
            cls;
            cls "$DIR";
            quit
          "

      # --------------------------------------------------
      # 8. Deploy
      # --------------------------------------------------
      - name: Deploy via FTPS
        run: |
          set -euo pipefail

          # ใช้ค่าที่ normalize แล้วจาก validate step (กันสอง step คำนวณไม่ตรงกัน)
          DIR="${FTP_DIR_CLEAN:-}"
          if [ -z "$DIR" ]; then
            echo "Error: missing prepared FTP directory"
            exit 1
          fi

          echo "=========================================="
          echo "        PRODUCTION DEPLOY"
          echo "=========================================="
          echo "Host: $FTP_HOST_CLEAN"
          echo "Directory: $DIR"
          echo "Commit: ${{ github.sha }}"
          echo "=========================================="

          timeout 240 lftp -e "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ftp:ssl-protect-list yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set dns:order inet;

            open $FTP_HOST_CLEAN;

            mirror -R \
              --verbose \
              --no-perms \
              --exclude .git/ \
              --exclude .github/ \
              --exclude node_modules/ \
              --exclude database.sql \
              --exclude README.md \
              --exclude 'original website/' \
              --exclude backups/ \
              --exclude uploads/ \
              . \"$DIR\";

            quit
          "

      # --------------------------------------------------
      # 9. Deployment completed
      # --------------------------------------------------
      - name: Deployment completed
        run: |
          echo "=========================================="
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "Time:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
