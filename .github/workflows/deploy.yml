name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BACKUP_RETENTION_DAYS: '7'

# กัน deploy ชนกัน: รันต่อคิว ไม่ยกเลิกตัวที่กำลัง mirror อยู่
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Create pre-deploy backup artifact
        run: |
          mkdir -p backups
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          SHA="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          REF="${{ github.ref }}"
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Deploy PROD start: sha=${SHA} actor=${ACTOR} ref=${REF}" >> backups/deploy.log
          echo "Backup retention days: ${{ env.BACKUP_RETENTION_DAYS }}" >> backups/deploy.log
          tar -czf "pre-deploy-${SHA}.tar.gz" \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=backups \
            --exclude=uploads \
            --exclude="original website" \
            --exclude=database.sql \
            . || true
          ls -lh pre-deploy-*.tar.gz || true

      - name: Attempt to download latest server backups (PROD)
        continue-on-error: true
        timeout-minutes: 4
        env:
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USER: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          # ล้าง newline/ช่องว่างกัน 530 (รหัสผ่านตัดแค่ CR/LF ไม่ตัดช่องว่างหัวท้าย)
          clean_host() {
            printf '%s' "$1" | tr -d '\r\n' | xargs | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' -e 's#.*@##' -e 's#/.*$##' -e 's#:.*$##' | tr '[:upper:]' '[:lower:]' | xargs
          }
          FTP_SERVER="$(clean_host "$FTP_SERVER")"
          FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '\r\n' | xargs)"
          FTP_PASS="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          mkdir -p server-backup/backups || true
          timeout 90 lftp -e "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ftp:ssl-protect-list yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            open -u \"${FTP_USER},${FTP_PASS}\" \"${FTP_SERVER}\";
            mirror --verbose --no-perms --only-newer /htdocs/backups ./server-backup/backups || echo 'No remote backups dir';
            quit
          " || echo "Server backup download skipped (timeout or connection issue)"
          ls -lh server-backup/ 2>&1 || true

      - name: Upload pre-deploy backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-prod-${{ github.sha }}
          path: |
            pre-deploy-${{ github.sha }}.tar.gz
            backups/deploy.log
            server-backup/
          if-no-files-found: warn
          retention-days: ${{ env.BACKUP_RETENTION_DAYS }}

      - name: Deploy via FTPS to PROD (lftp)
        timeout-minutes: 8
        env:
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USER: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.PROD_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.PROD_FTP_SERVER_DIR }}
        run: |
          # sanitize: ตัด scheme/userinfo/path/port ออก เหลือแค่ hostname (กัน Name or service not known)
          clean_host() {
            printf '%s' "$1" | tr -d '\r\n' | xargs | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' -e 's#.*@##' -e 's#/.*$##' -e 's#:.*$##' | tr '[:upper:]' '[:lower:]' | xargs
          }
          FTP_SERVER="$(clean_host "$FTP_SERVER")"
          # ล้าง newline/ช่องว่างกัน 530 (รหัสผ่านตัดแค่ CR/LF ไม่ตัดช่องว่างหัวท้าย)
          FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '\r\n' | xargs)"
          FTP_PASS="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          FTP_SERVER_DIR="$(printf '%s' "$FTP_SERVER_DIR" | tr -d '\r\n' | xargs)"
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Error: PROD_FTP_SERVER/USERNAME/PASSWORD secret ว่าง"
            exit 1
          fi
          if ! printf '%s' "$FTP_SERVER" | grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'; then
            echo "Error: PROD_FTP_SERVER ไม่ใช่ hostname ที่ถูกต้อง (ยาว ${#FTP_SERVER} ตัวอักษร) กรุณาใส่แค่ชื่อโฮสต์ เช่น ftpupload.net"
            exit 1
          fi
          echo "Checking DNS (host length ${#FTP_SERVER})..."
          getent hosts "$FTP_SERVER" | awk '{print "resolved: "$1}' || echo "WARNING: DNS lookup failed"
          # fallback ถ้าไม่ได้ตั้ง SERVER_DIR ให้ใช้ /htdocs/
          DIR="${FTP_SERVER_DIR:-/htdocs/}"
          echo "Deploying to PROD dir: $DIR"
          timeout 150 lftp -e "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ftp:ssl-protect-list yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 1;
            set net:reconnect-interval-base 5;
            open -u \"${FTP_USER},${FTP_PASS}\" \"${FTP_SERVER}\";
            ls \"$DIR\" || exit 1;
            mirror -R --verbose --delete --no-perms --exclude .git/ --exclude .github/ --exclude node_modules/ --exclude database.sql --exclude README.md --exclude 'original website/' --exclude backups/ --exclude uploads/ . $DIR;
            quit
          "
